name: sure_wholesaler
description: "A grocery e-commerce app."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  firebase_auth: ^6.1.4
  firebase_storage: ^13.0.6
  carousel_slider: ^5.1.1
  riverpod: ^3.0.0
  flutter_riverpod: ^3.0.0
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  permission_handler: ^12.0.1
  flutter_screenutil: ^5.9.3
  loading_animation_widget: ^1.3.0
  photo_view: ^0.15.0
  tuple: ^2.0.2
  go_router: ^17.0.1
  story_view: ^0.16.6
  flutter_animated_button: ^2.0.4
  location: ^8.0.1
  geocoding: ^3.0.0
  flutter_native_splash: ^2.4.7
  intl: ^0.20.2
  awesome_notifications: ^0.10.1
  firebase_messaging: ^16.1.1
  introduction_screen: ^4.0.0
  shared_preferences: ^2.3.0
  firebase_app_check: ^0.4.1+4
  geolocator: ^14.0.2
  google_maps_flutter: ^2.17.0
  flutter_foreground_task: ^9.2.2
  razorpay_flutter: ^1.4.4
  package_info_plus: ^9.0.1
  firebase_app_installations:
  pdf: ^3.11.0
  printing: ^5.13.4
  path_provider: ^2.1.5
  file_picker: ^11.0.0
  fade_shimmer: ^2.4.0
  smart_auth: ^3.2.0
  share_plus: ^10.1.4
  cloud_functions: ^6.2.0
  pinput: ^6.0.2
  another_flushbar: ^2.2.4
  change_app_package_name: ^1.5.0

 

dependency_overrides:
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/illustrations/
  #   - images/a_dot_ham.jpeg
flutter_native_splash:
  color: "#ffffff"
  image: assets/images/splash.jpeg
  android: true
  ios: true
  web: false
  fullscreen: false
  android_gravity: center
  ios_content_mode: center
  
  android_12:
    color: "#ffffff"
    icon_background_color: "#ffffff"
    image: assets/images/app_logo.jpeg
  


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.jpeg"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_logo.jpeg"
  web:
    generate: true
    image_path: "assets/images/splash.jpeg"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/images/splash.jpeg"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/splash.jpeg"
    
  linux:
    generate: true
    image_path: "assets/images/splash.jpeg"
    
  # The following line is used to specify the minimum SDK version for Android.
  
  min_sdk_android: 21
